<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>FlipEnglish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand-row">
      <h1 class="brand" aria-label="FlipEnglish">
        <span class="brand-flip">Flip</span><span class="brand-english">English</span>
      </h1>
      <button type="button" id="menu-btn" class="menu-btn" aria-label="メニュー" aria-haspopup="dialog" aria-expanded="false" aria-controls="app-menu">⋯</button>
    </div>

    <fieldset class="filter-group filter-group-level">
      <legend class="filter-group-label">Level</legend>
      <div id="level-tabs" class="level-tabs" role="tablist" aria-label="Level"></div>
    </fieldset>

    <fieldset class="filter-group filter-group-cat">
      <legend class="filter-group-label">Category</legend>
      <div id="cat-tabs" class="cat-tabs" role="tablist" aria-label="Category"></div>
    </fieldset>

    <fieldset class="filter-group filter-group-status">
      <legend class="filter-group-label">Filter</legend>
      <div id="filter-tabs" class="filter-tabs" role="tablist" aria-label="Filter"></div>
    </fieldset>
  </header>

  <main class="app-main">
    <div id="status" class="status" role="status" hidden></div>
    <div id="card-list" class="card-list" aria-live="polite"></div>
  </main>

  <div id="level-toast" class="level-toast" hidden role="status" aria-live="polite"></div>
  <div class="nav-fabs" aria-label="ページ移動">
    <button type="button" id="unread-btn" class="nav-fab" hidden aria-label="一番近い未読へ">↓未読</button>
    <button type="button" id="top-btn" class="nav-fab" hidden aria-label="ページ先頭へ">↑ Top</button>
  </div>

  <div id="menu-overlay" class="menu-overlay" hidden>
    <button type="button" class="menu-backdrop" aria-label="メニューを閉じる"></button>
    <div id="app-menu" class="menu-sheet" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <div class="menu-handle" aria-hidden="true"></div>
      <h2 id="menu-title" class="menu-title">メニュー</h2>
      <ul class="menu-list">
        <li>
          <button type="button" class="menu-item" data-menu="search" disabled>
            <span class="menu-item-icon" aria-hidden="true">⌕</span>
            <span class="menu-item-text">
              <span class="menu-item-label">検索</span>
              <span class="menu-item-sub">単語・訳で探す</span>
            </span>
          </button>
        </li>
        <li>
          <button type="button" class="menu-item" data-menu="reset" disabled>
            <span class="menu-item-icon" aria-hidden="true">↺</span>
            <span class="menu-item-text">
              <span class="menu-item-label">学習状態をリセット</span>
              <span class="menu-item-sub">すべて未読に戻す</span>
            </span>
          </button>
        </li>
        <li>
          <button type="button" class="menu-item" data-menu="help" disabled>
            <span class="menu-item-icon" aria-hidden="true">?</span>
            <span class="menu-item-text">
              <span class="menu-item-label">使い方</span>
              <span class="menu-item-sub">操作の説明</span>
            </span>
          </button>
        </li>
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
