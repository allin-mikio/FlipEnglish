<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>FlipEnglish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand-row">
      <h1 class="brand" aria-label="FlipEnglish">
        <span class="brand-flip">Flip</span><span class="brand-english">English</span>
      </h1>
      <button
        type="button"
        id="help-btn"
        class="help-btn"
        aria-label="Manual"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="help-sheet"
      >?</button>
    </div>

    <div class="search-bar">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        id="search-input"
        class="search-input"
        type="text"
        enterkeyhint="search"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        aria-label="検索"
      />
    </div>

    <fieldset class="filter-group filter-group-level">
      <legend class="filter-group-label">Level</legend>
      <div id="level-tabs" class="level-tabs" role="tablist" aria-label="Level"></div>
    </fieldset>

    <fieldset class="filter-group filter-group-cat">
      <legend class="filter-group-label">Category</legend>
      <div id="cat-tabs" class="cat-tabs" role="tablist" aria-label="Category"></div>
    </fieldset>

    <fieldset class="filter-group filter-group-status">
      <legend class="filter-group-label">Filter</legend>
      <div id="filter-tabs" class="filter-tabs" role="tablist" aria-label="Filter"></div>
    </fieldset>
  </header>

  <main class="app-main">
    <div id="status" class="status" role="status" hidden></div>
    <div id="card-list" class="card-list" aria-live="polite"></div>
  </main>

  <div id="level-toast" class="level-toast" hidden role="status" aria-live="polite"></div>
  <div id="app-toast" class="app-toast" hidden role="status" aria-live="polite"></div>
  <div class="nav-fabs" aria-label="ページ移動">
    <button type="button" id="unread-btn" class="nav-fab" hidden aria-label="一番近い未読へ">↓未読</button>
    <button type="button" id="top-btn" class="nav-fab" hidden aria-label="ページ先頭へ">↑ Top</button>
  </div>

  <div id="help-overlay" class="sheet-overlay" hidden>
    <button type="button" class="sheet-backdrop" data-close="help" aria-label="Manualを閉じる"></button>
    <div id="help-sheet" class="sheet-panel help-sheet" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="help-title" class="sheet-title">Manual</h2>
        <button type="button" class="sheet-close" data-close="help" aria-label="閉じる">×</button>
      </div>
      <ul class="help-list">
        <li>チェックを<strong>長押し</strong>で未読に戻す</li>
        <li>Level / Category を<strong>長押し</strong>すると、その範囲の学習状態を未読に戻せます（確認チェックあり）</li>
      </ul>
    </div>
  </div>

  <div id="reset-overlay" class="sheet-overlay reset-overlay" hidden>
    <button type="button" class="sheet-backdrop" data-close="reset" aria-label="キャンセル"></button>
    <div id="reset-dialog" class="reset-dialog" role="dialog" aria-modal="true" aria-labelledby="reset-title">
      <h2 id="reset-title" class="sheet-title">学習状態をリセット</h2>
      <p id="reset-message" class="reset-message"></p>
      <label class="reset-check">
        <input type="checkbox" id="reset-confirm-check" />
        <span>未読に戻す</span>
      </label>
      <div class="reset-actions">
        <button type="button" id="reset-cancel" class="reset-btn reset-btn-cancel">キャンセル</button>
        <button type="button" id="reset-ok" class="reset-btn reset-btn-ok" disabled>OK</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
